name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene gate (junk/secret files must not be tracked)
        run: tools/check-repo-hygiene.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint
        run: golangci-lint run
      - name: Format check (gofumpt + goimports)
        run: |
          golangci-lint fmt --diff ./... && \
          test -z "$(golangci-lint fmt --diff ./... 2>/dev/null)" || \
          { echo 'run "make fmt" and commit the result'; exit 1; }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Test
        run: go test -race -timeout 10m -coverprofile=coverage.out $(go list ./... | grep -vE '/cmd/|/examples/')
      - name: Coverage gate (library ≥ 70%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "library coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 70) { printf "coverage %s%% below the 70%% floor\n", t; exit 1 } }' 

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...
