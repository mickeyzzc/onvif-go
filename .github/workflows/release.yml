name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  tools:
    name: Build CLIs (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for cmd in discover onvif-diagnostics onvif-quick onvif-server; do
            go build -trimpath -o "dist/${cmd}_${GOOS}_${GOARCH}" "./cmd/${cmd}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
